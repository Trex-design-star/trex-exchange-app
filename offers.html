<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trex — Your offers</title>
<script src="js/trex.js"></script>
<script src="js/api.js"></script>
<style>
  :root{--black:#0B0D12;--blue:#155EEF;--blue-dark:#0B2FB3;--blue-soft:#E4EBFF;
    --brown:#8C5A2B;--brown-soft:#F4E9D8;--red:#D92D20;--red-soft:#FEE4E2;
    --ink:#0B0D12;--muted:#4B5563;--bg:#2A0A54;--card:#fff;--line:#E4E0D6;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 96px}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 12px;font-size:14px}
  .nav b{letter-spacing:.08em;color:#fff}
  .nav a{color:#B9CCFF;text-decoration:none;font-weight:600;margin-left:12px}
  .prev{display:inline-block;font-size:11px;font-weight:700;background:var(--brown-soft);color:var(--brown);border-radius:999px;padding:3px 10px;margin-bottom:8px}
  .top{background:var(--black);color:#fff;border-radius:var(--radius);padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .muted{color:var(--muted);font-size:13px}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
  .b-blue{background:var(--blue-soft);color:var(--blue-dark)}
  .b-red{background:var(--red-soft);color:var(--red)}
  label{font-size:13px;font-weight:700;display:block;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
  .btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-line{background:#fff;border:2px solid var(--black);color:var(--black)}
  .offer{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mini{width:auto;padding:8px 12px;font-size:13px;margin:6px 4px 0 0}
  .preview{background:#0B0D12;color:#fff;border-radius:12px;padding:14px;font-size:14px;margin-top:10px}
  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex}
  .bottomnav a{flex:1;text-align:center;padding:12px 4px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none}
  .bottomnav a.on{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><b>TREX</b><span><a href="dashboard.html">Home</a><a href="trade.html">Trade</a></span></div>
  <span class="prev">Preview — sample figures, no real money moves</span>
  <div class="top">
    <h2 style="margin:0 0 6px">Your offers</h2>
    <div class="muted" style="color:#C7CBD1">Offer any supported pair. Buyers trade against them instantly.</div>
  </div>

  <div class="card">
    <b id="formTitle">New offer</b>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label>Currency you provide</label><select id="provide"></select></div>
      <div><label>Currency you want</label><select id="want"></select></div>
    </div>
    <div class="muted" id="refLine"></div>
    <label>Your rate (how much they get per 1 you provide)</label>
    <input id="rate" type="number" step="any">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label>Minimum trade</label><input id="min" type="number" value="50"></div>
      <div><label>Maximum trade</label><input id="max" type="number" value="2000"></div>
    </div>
    <label>Payment methods</label><select id="methods" multiple size="3"></select>
    <label>When are you available?</label>
    <select id="avail"><option>Online now</option><option>Offline</option><option>Scheduled hours</option></select>
    <label>Offer terms (plain language)</label>
    <textarea id="terms" rows="2">Pay within 30 minutes. Receipt required.</textarea>
    <label>Display name</label>
    <input id="vendor" value="You • ★5.0 • 0 trades">
    <div class="preview" id="offerPreview"></div>
    <button class="btn btn-blue" id="save">Publish offer</button>
    <button class="btn btn-line" id="cancelEdit" style="display:none">Cancel editing</button>
  </div>

  <div class="card">
    <div class="row"><b>Your offers</b><select id="filter" style="width:auto"><option value="ALL">All pairs</option></select></div>
    <div id="list"></div>
  </div>

  <div class="card">
    <b>Your top markets</b>
    <div id="analytics" class="muted">Your completed trades will build this picture.</div>
  </div>
</div>
<nav class="bottomnav"><a href="dashboard.html">Home</a><a href="trade.html">Trade</a><a href="offers.html" class="on">Sell</a><a href="settings.html">Profile</a><a href="more.html">More</a></nav>
<script>
var $=function(id){return document.getElementById(id);};
var KEY="trex_offers";
var seed=[
  {id:"OFR-1",provide:"USD",want:"NGN",rate:1520,rateText:"₦1,520 / $1",min:65,max:330,vendor:"Adaobi • ★4.8 • 312 trades",country:"NG",tier:"Gold",capacity:4000,methods:["Bank transfer"],terms:"Pay within 30 minutes.",live:true,legacy:true,pair:"USD/NGN"},
  {id:"OFR-2",provide:"GBP",want:"NGN",rate:1940,rateText:"₦1,940 / £1",min:103,max:2060,vendor:"Tunde • ★4.9 • 540 trades",country:"NG",tier:"Gold",capacity:3000,methods:["Bank transfer"],terms:"Pay within 30 minutes.",live:true,legacy:true,pair:"GBP/NGN"},
  {id:"OFR-3",provide:"EUR",want:"NGN",rate:1650,rateText:"₦1,650 / €1",min:60,max:1500,vendor:"New vendor • ★new • 3 trades",country:"NG",tier:"Probation",capacity:2000,methods:["Bank transfer"],terms:"Pay within 1 hour.",live:true,legacy:true,pair:"EUR/NGN"}
];
function load(){ try{ var v=JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(v)&&v.length) return v.map(function(o){return TREX.normalizeOffer(o);}); }catch(e){} return seed; }
function store(v){ localStorage.setItem(KEY,JSON.stringify(v)); }
var offers=load(), editing=null;
function apiPost(path,body){ try{ if(window.API&&API.on){ API.post(path,body,API.key()).catch(function(){}); } }catch(e){} }
(function boot(){ try{ if(window.API&&API.on){ API.get("/offers?all=1").then(function(r){ if(r&&r.ok&&r.offers&&r.offers.length){ offers=r.offers.map(function(o){return TREX.normalizeOffer(o);}); store(offers); render(); } }).catch(function(){}); } }catch(e){} })();
function fillCur(sel,val){ sel.innerHTML=""; TREX.CURRENCIES.forEach(function(c){ var o=document.createElement("option"); o.value=c.code; o.textContent=c.flag+" "+c.code+" — "+c.name; sel.appendChild(o); }); sel.value=val; }
function prof(){ return TREX.profile()||{countryCode:"NG"}; }
function refreshMethods(){
  var pm=TREX.paymentsFor(prof().countryCode||"NG",$("provide").value);
  var s=$("methods"); s.innerHTML="";
  (pm.available?pm.methods:[{id:"none",name:"No payment method available in your country yet"}]).forEach(function(m){
    var o=document.createElement("option"); o.value=m.name; o.textContent=m.name+(m.eta?" ("+m.eta+")":""); s.appendChild(o);
  });
}
function refreshPreview(){
  var p=$("provide").value, w=$("want").value;
  if(p===w){ $("refLine").textContent="Pick two different currencies."; return; }
  var ref=TREX.refRate(p,w);
  $("refLine").textContent="Market reference: 1 "+p+" ≈ "+(ref?TREX.fmtMoney(ref,w):"—")+" (illustrative)";
  if(! $("rate").value && ref) $("rate").value=Number(ref.toPrecision(6));
  var rate=Number($("rate").value)||0, fee=1.5;
  var net=rate*(1-fee/100);
  $("offerPreview").innerHTML="<b>Offer preview — "+p+" → "+w+"</b><br>Your rate: "+TREX.fmtMoney(rate,w)+" per "+p
    +"<br>Minimum "+$("min").value+" "+p+" • Maximum "+$("max").value+" "+p
    +"<br>Typical fee ≈ "+fee+"% • Customer receives ≈ "+TREX.fmtMoney(net,w)+" per "+p;
  var st=TREX.pairStatus(p,w);
  if(st!=="LIVE"&&st!=="LIMITED") $("offerPreview").innerHTML+="<br>⚠ This pair is currently "+st+" — publishing will keep it hidden until it opens.";
}
["provide","want"].forEach(function(id){ $(id).addEventListener("change",function(){ refreshMethods(); refreshPreview(); }); });
$("rate").oninput=refreshPreview; $("min").oninput=refreshPreview; $("max").oninput=refreshPreview;
function render(){
  var f=$("filter").value; $("list").innerHTML="";
  var sel=$("filter"); var cur=sel.value; sel.innerHTML='<option value="ALL">All pairs</option>';
  var pairs={}; offers.forEach(function(o){ var k=(o.provide||"?")+" → "+(o.want||"?"); pairs[k]=1; });
  Object.keys(pairs).forEach(function(k){ var o=document.createElement("option"); o.textContent=k; sel.appendChild(o); });
  sel.value=cur;
  offers.filter(function(o){ return f==="ALL"||((o.provide+" → "+o.want)===f); }).forEach(function(o){
    var d=document.createElement("div"); d.className="offer";
    d.innerHTML="<div class='row'><b>"+o.provide+" → "+o.want+"</b><span class='badge "+(o.live?"b-blue":"b-red")+"'>"+(o.live?"Live":"Paused")+"</span></div>"
      +"<div>Rate: "+TREX.fmtMoney(o.rate,o.want)+" per "+o.provide+"</div>"
      +"<div class='muted'>Min "+o.min+" "+o.provide+" – Max "+o.max+" "+o.provide+" • "+(o.methods||[]).join(", ")+"</div>";
    var e=document.createElement("button"); e.className="btn btn-line mini"; e.textContent="Edit";
    e.onclick=function(){ editing=o.id; $("formTitle").textContent="Edit offer"; $("provide").value=o.provide; $("want").value=o.want; $("rate").value=o.rate; $("min").value=o.min; $("max").value=o.max; $("vendor").value=o.vendor; $("terms").value=o.terms||""; $("cancelEdit").style.display="block"; refreshMethods(); refreshPreview(); window.scrollTo({top:0,behavior:"smooth"}); };
    var p2=document.createElement("button"); p2.className="btn btn-line mini"; p2.textContent=o.live?"Pause":"Resume";
    p2.onclick=function(){ o.live=!o.live; store(offers); render(); apiPost("/offers",{id:o.id,live:o.live}); TREX.audit("Offer "+(o.live?"resumed ":"paused ")+o.id); };
    var del=document.createElement("button"); del.className="btn btn-line mini"; del.textContent="Delete";
    del.onclick=function(){ if(confirm("Delete this offer?")){ apiPost("/offers",{id:o.id,delete:true}); offers=offers.filter(function(x){return x.id!==o.id;}); store(offers); render(); } };
    d.append(e,p2,del); $("list").appendChild(d);
  });
  var trades=TREX.load("trex_trades",[]), byPair={};
  trades.forEach(function(t){ byPair[t.pair]=byPair[t.pair]||{n:0,amt:0,cur:t.cur}; byPair[t.pair].n++; byPair[t.pair].amt+=Number(t.amount)||0; });
  var keys=Object.keys(byPair);
  $("analytics").innerHTML=keys.length?keys.map(function(k){return "<div>• "+k+": "+byPair[k].n+" trades, "+byPair[k].amt.toLocaleString()+" "+byPair[k].cur+" volume</div>";}).join(""):"Your completed trades will build this picture.";
}
$("save").onclick=function(){
  var p=$("provide").value, w=$("want").value;
  if(p===w){ alert("Pick two different currencies."); return; }
  var min=Number($("min").value), max=Number($("max").value);
  if(!(min>0)||!(max>min)){ alert("Maximum must be above minimum."); return; }
  var rate=Number($("rate").value); if(!(rate>0)){ alert("Set your rate first."); return; }
  var methods=[...$("methods").selectedOptions].map(function(o){return o.value;});
  if(!methods.length) methods=["Bank transfer"];
  if(editing){ var o=offers.find(function(x){return x.id===editing;});
    Object.assign(o,{provide:p,want:w,rate:rate,rateText:TREX.fmtMoney(rate,w)+" per "+p,min:min,max:max,methods:methods,vendor:$("vendor").value,terms:$("terms").value,avail:$("avail").value});
    apiPost("/offers",{id:o.id,rate:rate,min:min,max:max,methods:methods,vendor:o.vendor,terms:o.terms});
    editing=null; $("formTitle").textContent="New offer"; $("cancelEdit").style.display="none";
  } else { var no={provide:p,want:w,rate:rate,min:min,max:max,methods:methods,vendor:$("vendor").value,country:prof().countryCode,terms:$("terms").value};
    apiPost("/offers",no);
    offers.push(Object.assign({id:"OFR-"+Date.now().toString(36).toUpperCase(),rateText:TREX.fmtMoney(rate,w)+" per "+p,tier:"Probation",capacity:5000,avail:$("avail").value,live:true},no));
  }
  store(offers); render(); TREX.audit("Offer published "+p+"→"+w);
};
$("cancelEdit").onclick=function(){ editing=null; $("formTitle").textContent="New offer"; $("cancelEdit").style.display="none"; };
$("filter").onchange=render;
fillCur($("provide"),"USD"); fillCur($("want"),"NGN"); refreshMethods(); refreshPreview(); store(offers); render();
</script>
</body>
</html>
